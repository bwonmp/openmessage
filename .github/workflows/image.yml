name: image

# Builds the openmessage image and pushes it to GHCR.
#
# Upstream (MaxGhenis/openmessage) publishes no image at all — its release.yml
# has no Docker or GHCR step — so this fork builds one for tower to pull. Same
# path BRY-421 proved with bwonmp/pantry, and this file is that workflow with
# the build-arg the openmessage Dockerfile takes.
#
# Runs on ubuntu-latest on purpose: tower's self-hosted runner is repo-scoped
# to bwonmp/docker and has no docker socket.
#
# The compose file in bwonmp/docker pins tag AND digest, so read the digest
# from this run's summary (or `docker buildx imagetools inspect`) and put both
# in openmessage/compose.yml.

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,format=short
            type=semver,pattern={{version}}

      - name: Build and push
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # The Dockerfile stamps this into main.version via -ldflags.
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Report the pinnable reference
        run: |
          echo "### Pin this in bwonmp/docker openmessage/compose.yml" >> "$GITHUB_STEP_SUMMARY"
          echo '```yaml' >> "$GITHUB_STEP_SUMMARY"
          echo "    image: ghcr.io/${{ github.repository }}:${{ steps.meta.outputs.version }}@${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
